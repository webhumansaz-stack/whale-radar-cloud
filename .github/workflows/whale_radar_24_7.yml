name: 24/7 Whale & Arbitrage Cloud Engine

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: whale-radar-bot-singleton
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Whale & Arbitrage Telegram Stars Bot (52-min Cloud Cycle)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: "WhaleAlphaStars_bot"
          ADMIN_IDS: "1130748016"
          PUBLIC_CHANNEL_ID: "-1004394052906"
          VIP_CHANNEL_ID: "-1004378660307"
          PRICE_UNLOCK_SIGNAL_STARS: "50"
          PRICE_VIP_MONTHLY_STARS: "300"
          PRICE_DEEP_SCAN_STARS: "25"
          AUTO_POST_INTERVAL_MINUTES: "45"
          FREE_DAILY_SCANS: "1"
          REFERRALS_PER_FREE_UNLOCK: "3"
          MAX_RUNTIME_SECONDS: "3100"
        run: python bot.py

      - name: Persist SQLite State & Chain Next 24/7 Cloud Cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "WhaleRadar Cloud Engine"
          git config user.email "bot@whaleradar.global"
          git pull --rebase origin main || true
          git add whale_radar.db || true
          git diff --staged --quiet || git commit -m "chore(db): sync live signals, VIP users & Stars payments [skip ci]"
          git push origin main || true
          gh workflow run whale_radar_24_7.yml || true
